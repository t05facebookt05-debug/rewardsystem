<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小組獎勵計劃</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    .star-glow { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.6)); }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- 頂部導覽列 Header -->
  <header id="site-header" class="bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-white shadow-lg sticky top-0 z-40 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo & 標題 -->
      <div class="flex items-center space-x-3">
        <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
          <i class="fa-solid fa-star text-2xl text-yellow-300 animate-pulse star-glow"></i>
        </div>
        <div>
          <h1 id="header-title-text" class="font-black text-xl tracking-wide leading-tight">星星獎勵計劃</h1>
          <p id="header-subtitle-text" class="text-xs text-amber-100 hidden sm:block">好表現・積累星光・換領好禮</p>
        </div>
      </div>

      <!-- 中央：班別切換器 (Class Switcher) -->
      <div class="flex items-center bg-black/15 px-3 py-1.5 rounded-full border border-white/20">
        <i class="fa-solid fa-users text-amber-200 mr-2 text-sm"></i>
        <span class="text-xs mr-2 font-bold text-amber-100 hidden md:inline">班別：</span>
        <select id="global-class-select" onchange="handleClassChange(this.value)" class="bg-transparent text-white font-bold text-sm focus:outline-none cursor-pointer border-none">
          <!-- JS 動態帶入 -->
        </select>
      </div>

      <!-- 右側：視角切換 (前台 / 後台) -->
      <div class="flex items-center space-x-2">
        <div id="status-badge" class="hidden sm:flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-amber-400/30 text-white border border-white/30">
          <span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-ping"></span>
          前台學生視角
        </div>

        <button id="toggle-admin-btn" onclick="openAdminModal()" class="bg-white/20 hover:bg-white/30 active:scale-95 text-white px-3.5 py-1.5 rounded-lg text-sm font-bold transition flex items-center shadow-sm">
          <i class="fa-solid fa-user-shield mr-1.5"></i>
          <span id="admin-btn-text">切換至後台</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 主要內容區 Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- ================= 前台學生視角 STUDENT VIEW ================= -->
    <div id="student-view" class="space-y-6">

      <!-- 英雄榜 Banner -->
      <div id="hero-banner" class="rounded-3xl bg-gradient-to-r from-amber-400 via-orange-400 to-amber-500 p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
        <div class="absolute -right-10 -bottom-10 opacity-10 text-9xl font-black">★
